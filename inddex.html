<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage AI — Build Department KPI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--navy2:#1B2740;--blue:#4A90E2;--blueDk:#0070C0;--body:#5A6C7D;--bord:#E2E8F0;--grid:#E6EBF1;--surf:#F8FAFC;--surf2:#F1F5F9;--good:#10B981;--bad:#EF4444;--mut:#9CA3AF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,Arial,sans-serif;color:var(--body);background:#fff;font-size:14px}
h1,h2,h3,.mont{font-family:Montserrat,Arial,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blueDk)}
button{font-family:inherit;cursor:pointer}
#root{display:flex;min-height:100vh}
/* sidebar */
#side{width:230px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#side .logo{padding:22px 20px 18px;font-family:Montserrat;font-weight:800;font-size:19px;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.08)}
#side .logo b{color:#fff}#side .logo span{color:var(--blue)}
#side .sub{font-family:Montserrat;font-weight:600;font-size:12px;letter-spacing:.12em;color:#7D8CA3;margin-top:5px}
nav{padding:14px 0;flex:1}
nav a{display:flex;align-items:center;gap:11px;padding:11px 20px;color:#AEBCCB;font-weight:500;font-size:13.5px;border-left:3px solid transparent}
nav a svg{flex:none}
nav a:hover{background:rgba(255,255,255,.05);color:#fff}
nav a.on{background:var(--navy2);color:#fff;border-left-color:var(--blue)}
#side .foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.snapchip{display:inline-block;background:var(--navy2);color:#7DB2EA;font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 10px;border-radius:6px}
.livesync{display:flex;align-items:center;gap:8px;margin-top:12px;color:#7D8CA3;cursor:not-allowed}
.livesync .tog{width:30px;height:16px;border-radius:8px;background:#2A3A55;position:relative}
.livesync .tog::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#55688A}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:16px;padding:0 28px;height:60px}
#top h1{font-size:19px;font-weight:700;color:var(--navy);margin:0;flex:1;letter-spacing:-.01em}
#gsearch{width:250px;padding:8px 12px;border:1px solid var(--bord);border-radius:8px;font:inherit;font-size:13px;color:var(--navy);background:var(--surf)}
#gsearch:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{background:var(--blueDk);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px}
.btn:hover{background:#005A9C}
/* filter bar */
#fbar{position:sticky;top:60px;z-index:29;background:#fff;border-bottom:1px solid var(--bord);padding:10px 28px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.flabel{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--bord);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:none;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--body)}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
.chip{border:1px solid var(--bord);background:#fff;border-radius:14px;padding:4px 11px;font-size:12px;font-weight:500;color:var(--body)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{opacity:.7;font-size:11px}
.reset{background:none;border:none;color:var(--blue);font-weight:600;font-size:12.5px}
.fcap{font-size:12px;color:var(--mut);width:100%}
/* content */
#content{padding:24px 28px 10px;flex:1;background:var(--surf)}
.page{display:none;max-width:1460px;margin:0 auto}
.page.on{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kpirow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:var(--navy);border-radius:14px;padding:18px 20px;color:#fff}
.kpi .lab{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.1em;color:#7D8CA3;text-transform:uppercase}
.kpi .num{font-family:Montserrat;font-weight:800;font-size:36px;color:var(--blue);margin:6px 0 2px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:#AEBCCB}
.kpi .sub .up{color:var(--good)}.kpi .sub .dn{color:var(--bad)}
.card{background:#fff;border:1px solid var(--bord);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.05);margin-top:16px}
.card .hd{padding:14px 20px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:12px}
.card .hd h3{margin:0;font-size:14px;font-weight:700;color:var(--navy);flex:1}
.card .hd .cap{font-size:12px;color:var(--mut)}
.card .bd{padding:18px 20px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.grid2eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.insight{margin-top:14px;font-size:14px;color:var(--navy);background:#fff;border:1px solid var(--bord);border-left:3px solid var(--blue);border-radius:10px;padding:12px 16px}
canvas.chart{width:100%;display:block}
/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--bord);cursor:pointer;white-space:nowrap;user-select:none}
.tbl th .si{color:var(--blue)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--surf2);color:var(--body);white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover{background:var(--surf)}
.tbl tr.sel{background:#EDF5FD}
.tname{font-weight:600;color:var(--navy)}
.d-up{color:var(--good);font-weight:600}.d-dn{color:var(--bad);font-weight:600}.d-z{color:var(--mut)}
.pill{display:inline-block;font-family:Montserrat;font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.pill.gray{background:var(--surf2);color:var(--mut)}
.pill.blue{background:#E0F2FE;color:var(--blueDk)}
.pill.green{background:#D1FAE5;color:#047857}
.pill.navy{background:var(--navy);color:#fff}
.v2chip{display:inline-block;background:#E0F2FE;color:var(--blueDk);font-family:Montserrat;font-weight:700;font-size:12px;padding:3px 10px;border-radius:6px;letter-spacing:.05em}
/* ticker / feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:10px 0;border-bottom:1px solid var(--surf2);display:flex;gap:10px;align-items:baseline}
.feed .prn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blueDk);flex:none}
.feed .prt{font-size:13px;color:var(--body);line-height:1.4}
/* timeline */
.tline{position:relative;margin:8px 0 4px;padding-left:0;height:96px}
.tline .axis{position:absolute;left:0;right:0;top:46px;height:2px;background:var(--grid)}
.tline .dot{position:absolute;top:40px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.tline .vl{position:absolute;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--navy);transform:translateX(-50%);white-space:nowrap}
.tline .dl{position:absolute;top:66px;font-size:12px;color:var(--mut);transform:translateX(-50%);white-space:nowrap}
/* blocked cards */
.ownergrp{margin-top:14px}
.bcard{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px 18px;margin-top:10px;display:flex;gap:14px;align-items:flex-start}
.bcard .it{font-weight:600;color:var(--navy);min-width:210px}
.bcard .nt{flex:1;font-size:13px;line-height:1.45}
.ochip{display:inline-block;background:var(--navy);color:#fff;font-family:Montserrat;font-weight:700;font-size:12px;padding:3px 11px;border-radius:12px}
/* activity timeline */
.vtl{position:relative;margin:6px 0 0;padding-left:26px}
.vtl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--grid)}
.vtl .ev{position:relative;padding:9px 0}
.vtl .ev::before{content:"";position:absolute;left:-23px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
/* pipeline strip */
.pstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--mut)}
.pstrip b{color:var(--body);font-weight:600;background:var(--surf2);border-radius:6px;padding:4px 10px}
.pstrip svg{flex:none}
/* quality */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.qcard{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.qcard .lab{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.qcard .num{font-family:Montserrat;font-weight:800;font-size:30px;color:var(--navy);margin:8px 0 4px}
.qcard .num em{font-style:normal;color:var(--blue)}
.qcard .sub{font-size:12.5px;line-height:1.45}
.qcard.v2 .num{color:var(--mut);font-weight:700}
/* empty */
.empty{padding:36px 20px;text-align:center;color:var(--mut)}
.empty svg{display:block;margin:0 auto 10px}
/* tooltip */
#tip{position:fixed;z-index:99;background:var(--navy);color:#fff;font-size:12px;padding:6px 10px;border-radius:7px;pointer-events:none;display:none;white-space:pre;font-family:Inter}
/* footer */
#foot{padding:16px 28px 22px;background:var(--surf);text-align:center;font-size:12px;color:var(--mut)}
.errbanner{background:var(--bad);color:#fff;font-weight:600;padding:12px 20px;border-radius:10px;margin-bottom:14px}
.pgbtns{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 0 0}
.pgbtns button{border:1px solid var(--bord);background:#fff;border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--body)}
.pgbtns button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.searchmini{padding:8px 12px;border:1px solid var(--bord);border-radius:8px;font:inherit;font-size:13px;width:220px}
@media(max-width:1100px){#side{width:64px}#side .logo{font-size:0;padding:20px 12px}#side .logo span{font-size:17px}#side .sub,#side nav a em,#side .foot{display:none}nav a{justify-content:center;padding:12px}}
@media(max-width:800px){.kpirow{grid-template-columns:1fr 1fr}.grid2,.grid2eq,.qgrid{grid-template-columns:1fr}#fbar{top:auto;position:static}}
@media print{#side,#fbar,#top #gsearch,#top .btn{display:none}#content{padding:0}}
</style>
</head>

  '<span class="flabel">MONTH</span><span class="seg">'+mopts.map(m=>'<button data-m="'+m[0]+'" class="'+(state.month===m[0]?"on":"")+'">'+m[1]+'</button>').join("")+'</span>'+
  '<span class="flabel">RELEASE TYPE</span><span class="seg">'+ropts.map(r=>'<button data-r="'+r[0]+'" class="'+(state.rel===r[0]?"on":"")+'">'+r[1]+'</button>').join("")+'</span>'+
  '<span class="flabel">TEAMMATES</span><span class="chips">'+ASSETS.map(a=>{const c=ROWS.filter(r=>r.a===a).length;return '<button class="chip '+(state.team.has(a)&&state.team.size<ASSETS.length?"on":state.team.size===ASSETS.length?"":"")+' '+(state.team.size<ASSETS.length&&state.team.has(a)?"on":"")+'" data-a="'+a+'">'+a+' <small>'+c+'</small></button>'}).join("")+'</span>'+
  '<button class="reset" id="resetf">Reset</button>'+
  (active.length?'<span class="chips" style="width:100%">'+active.map((c,i)=>'<button class="chip on" data-x="'+i+'">'+esc(c.t)+' ✕</button>').join("")+'</span>':"")+
  '<span class="fcap">Production view excludes July prebuild releases ('+ROWS.filter(r=>r.pre).length+' rows, all July) — switch to “All” to reconcile to 223.</span>';
 fb.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.month=b.dataset.m;refresh()});
 fb.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{state.rel=b.dataset.r;refresh()});
 fb.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(state.team.size===ASSETS.length){state.team=new Set([a])}
  else if(state.team.has(a)){state.team.delete(a);if(!state.team.size)state.team=new Set(ASSETS)}
  else state.team.add(a);refresh()});
 fb.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{active[+b.dataset.x].x();refresh()});
 document.getElementById("resetf").onclick=()=>{state.month="all";state.team=new Set(ASSETS);state.rel="prod";state.sel=null;refresh()};
}

 const el=document.getElementById("pg-overview");const rows=fRows();const A=byAsset(rows);
 const augN=rows.filter(r=>r.m==="08").length, julN=rows.filter(r=>r.m==="07").length;
 const mom=fmtD(julN,augN);
 const activeLines=ASSETS.filter(a=>A[a].aug>0).length;
 el.innerHTML=
 '<div class="kpirow">'+

  kpi("MoM vs July","k2",'<span class="sub"><span class="'+(mom.d>=0?"up":"dn")+'">'+mom.txt+'</span></span>')+
  kpi("Active teammate lines","k3",'<span class="sub">of 14 lines in August</span>')+

 '</div>'+
 '<div class="insight">August shipped half again more than July (89 → 134, +50.6% on all rows); the platform line went from zero to the factory’s most-shipped asset (0 → 30).</div>'+
 '<div class="grid2"><div>'+
  card("Deploys per week","annotation on Aug 27 — hover the last point",'<canvas class="chart" id="cWeek"></canvas>')+

 '</div><div>'+
  card("Activity","latest 8 PRs — workforce.manageai",'<ul class="feed">'+ACTIVITY.slice(0,8).map(p=>'<li><span class="prn">'+p[0]+'</span><span class="prt">'+esc(p[1])+(p[2]?' <span class="pill green">MERGED</span>':"")+'</span></li>').join("")+'</ul>')+
  card("Waiting on humans","",'<div style="display:flex;align-items:center;gap:16px"><span class="mont" style="font-size:34px;font-weight:800;color:#0F172A">6</span><span style="font-size:13px;line-height:1.45">items waiting on a human decision.<br><a href="#blocked">Open Blocked &amp; Decisions →</a></span></div>')+
 '</div></div>';
 countUp(q("#k1"),augN);
 q("#k2").textContent=(mom.d>0?"+":"")+mom.d; q("#k2").dataset.v=mom.d;
 countUp(q("#k3"),activeLines);countUp(q("#k4"),47);q("#k5").textContent="33/33";
 if(!rows.length){q("#cWeek").parentElement.innerHTML=emptyState("No rows match the current filters.");return}
 const wc=weekCounts(rows);
 lineChart(q("#cWeek"),WEEKS.map(w=>w[0]),wc,{annotIndex:6,annotText:"Aug 27: semi-automated sweep armed",h:280});
 /* movers */
 const movers=ASSETS.map(a=>({a,jul:A[a].jul,aug:A[a].aug,d:A[a].aug-A[a].jul})).filter(m=>m.jul||m.aug).sort((x,y)=>y.d-x.d);
 const top=[...movers.slice(0,3),...movers.slice(-1)];
 hBars(q("#cMovers"),top.map(m=>({label:m.a+" "+m.jul+"→"+m.aug+(m.a==="charlito"?" *":""),n:Math.abs(m.d),c:m.d>=0?"#4A90E2":"#0F172A"})),{lw:230});
 q("#cMovers").insertAdjacentHTML("afterend",'<div style="font-size:12px;color:var(--mut);margin-top:6px">* charlito 24→0 — scoping teammate; work moved to the regan line.</div>');
}
function kpi(lab,id,sub){return '<div class="kpi"><div class="lab">'+lab+'</div><div class="num" id="'+id+'">0</div>'+sub+'</div>'}
function card(t,cap,body){return '<div class="card"><div class="hd"><h3>'+t+'</h3><span class="cap">'+cap+'</span></div><div class="bd">'+body+'</div></div>'}
const q=s=>document.querySelector(s);

function pgDeployments(){
 const el=document.getElementById("pg-deployments");const rows=fRows();const A=byAsset(rows);
 const list=ASSETS.map(a=>{const g=A[a];const latest=g.rows.slice().sort((x,y)=>y.d.localeCompare(x.d))[0];
  return{a,jul:g.jul,aug:g.aug,d:g.aug-g.jul,lv:latest?latest.v:"—",ld:latest?latest.d:"—",rows:g.rows}}).filter(t=>t.jul||t.aug);
 const sk=state.sort;list.sort((x,y)=>{const vx=x[sk.k],vy=y[sk.k];return(typeof vx==="string"?vx.localeCompare(vy):vx-vy)*sk.dir});
 const qtxt=state.q.toLowerCase();
 const shown=list.filter(t=>!qtxt||t.a.includes(qtxt)||t.lv.toLowerCase().includes(qtxt));
 const sortHd=(k,l)=>'<th data-k="'+k+'">'+l+(sk.k===k?' <span class="si">'+(sk.dir>0?"▲":"▼")+'</span>':"")+'</th>';
 el.innerHTML=
  card("July vs August per teammate","click a bar group to drill down",'<div style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:8px"><span class="seg"><button id="vwM" class="'+(!state.augWeekView?"on":"")+'">By month</button><button id="vwW" class="'+(state.augWeekView?"on":"")+'">August by week</button></span></div><canvas class="chart" id="cMain"></canvas>'+
   '<div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--mut)"><span><span style="display:inline-block;width:10px;height:10px;background:#8FB9E8;border-radius:2px"></span> July</span><span><span style="display:inline-block;width:10px;height:10px;background:#4A90E2;border-radius:2px"></span> August</span></div>')+
  (state.sel?drill(A[state.sel]):"")+
  card("Teammates","row click drills down · sortable",'<div style="overflow:auto"><table class="tbl"><thead><tr>'+sortHd("a","Teammate")+sortHd("jul","Jul")+sortHd("aug","Aug")+sortHd("d","MoM Δ")+sortHd("lv","Latest version")+sortHd("ld","Latest deploy")+'<th>8-week trend</th></tr></thead><tbody>'+
   (shown.length?shown.map(t=>{const dd=fmtD(t.jul,t.aug);return '<tr class="click '+(state.sel===t.a?"sel":"")+'" data-a="'+t.a+'"><td class="tname">'+t.a+'</td><td>'+t.jul+'</td><td>'+t.aug+'</td><td class="'+(dd.d>0?"d-up":dd.d<0?"d-dn":"d-z")+'">'+(dd.d>0?"▲ ":dd.d<0?"▼ ":"")+dd.txt+'</td><td class="mono">'+t.lv+'</td><td>'+t.ld+'</td><td><canvas class="spk" data-a="'+t.a+'"></canvas></td></tr>'}).join(""):'<tr><td colspan="7">'+emptyState("No teammates match.")+'</td></tr>')+
  '</tbody></table></div>')+
  rawTable(rows);
 /* main chart */
 const act=list.slice().sort((x,y)=>y.aug-x.aug);
 if(!rows.length){q("#cMain").parentElement.innerHTML=emptyState("No rows match the current filters.")}
 else if(!state.augWeekView){
  groupedBars(q("#cMain"),act.map(t=>t.a),[{name:"July",color:"#8FB9E8",data:act.map(t=>t.jul)},{name:"August",color:"#4A90E2",data:act.map(t=>t.aug)}],{h:320,rot:true,onBar:a=>{state.sel=(state.sel===a?null:a);refresh()}});
 }else{
  const augWeeks=WEEKS.slice(3);const ramp=["#4A90E2","#1E40AF","#8FB9E8","#0F172A","#6BA0DE","#7DB2EA","#2E5FA3","#A8C8EC","#16233F","#5C9BE0","#8FB9E8","#3D77C2","#B9D3F0","#1B2740"];
  const tops=act.filter(t=>t.aug>0);
  stackedBars(q("#cMain"),augWeeks.map(w=>w[0]),tops.map((t,i)=>({name:t.a,color:ramp[i%ramp.length],data:augWeeks.map((w,wi)=>t.rows.filter(r=>weekIdx(r)===wi+3).length)})),{h:320});
 }
 q("#vwM").onclick=()=>{state.augWeekView=false;refresh()};
 q("#vwW").onclick=()=>{state.augWeekView=true;refresh()};
 document.querySelectorAll("#pg-deployments .tbl th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sk.k===k)sk.dir*=-1;else{sk.k=k;sk.dir=-1}refresh()});
 document.querySelectorAll("#pg-deployments tr.click").forEach(tr=>tr.onclick=()=>{state.sel=(state.sel===tr.dataset.a?null:tr.dataset.a);refresh()});
 document.querySelectorAll("canvas.spk").forEach(cv=>{const a=cv.dataset.a;const g=A[a];const last8=WEEKS.map((_,i)=>g.rows.filter(r=>weekIdx(r)===i).length);spark(cv,last8)});
 wireRaw(rows);
}
function drill(g){
 const rs=g.rows.slice().sort((x,y)=>x.d.localeCompare(y.d));if(!rs.length)return"";
 const first=Date.parse(rs[0].d),last=Date.parse(rs[rs.length-1].d),span=Math.max(1,last-first);
 const name=rs[0].a;
 const show=rs.length>14?rs.filter((_,i)=>i%Math.ceil(rs.length/14)===0||i===rs.length-1):rs;
 const qtxt=state.q.toLowerCase();
 const tbl=g.rows.filter(r=>!qtxt||r.v.toLowerCase().includes(qtxt)||r.pkg.toLowerCase().includes(qtxt)||r.d.includes(qtxt));
 return card("Drill-down — "+name+" version timeline",rs.length+" releases · "+rs[0].v+" → "+rs[rs.length-1].v,
  '<div class="tline"><div class="axis"></div>'+show.map((r,i)=>{const p=6+88*(Date.parse(r.d)-first)/span;
   return '<span class="dot" style="left:'+p+'%" title="'+r.v+' · '+r.d+'"></span><span class="vl" style="left:'+p+'%;top:'+(i%2?"8px":"22px")+'">'+r.v+'</span><span class="dl" style="left:'+p+'%">'+r.d.slice(5)+'</span>'}).join("")+'</div>'+
  '<div style="overflow:auto;max-height:280px;margin-top:10px"><table class="tbl"><thead><tr><th>Date</th><th>Version</th><th>Package</th></tr></thead><tbody>'+
   tbl.slice().sort((x,y)=>y.d.localeCompare(x.d)).map(r=>'<tr><td>'+r.d+'</td><td class="mono">'+r.v+(r.pre?' <span class="pill gray">PREBUILD</span>':"")+'</td><td class="mono" style="font-size:12px">'+esc(r.pkg||"—")+'</td></tr>').join("")+
  '</tbody></table></div>');
}
function rawTable(rows){
 const qtxt=state.q.toLowerCase();
 const all=rows.filter(r=>!qtxt||r.a.includes(qtxt)||r.v.toLowerCase().includes(qtxt)||r.pkg.toLowerCase().includes(qtxt)||r.d.includes(qtxt)).slice().sort((x,y)=>y.d.localeCompare(x.d));
 const pp=25,pages=Math.max(1,Math.ceil(all.length/pp));state.rawPage=Math.min(state.rawPage,pages-1);
 const pg=all.slice(state.rawPage*pp,state.rawPage*pp+pp);
 return card("Raw releases","all rows in view · searchable · 25/page","").replace('<div class="bd"></div>','<div class="bd">'+
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="cap" style="font-size:12px;color:var(--mut)">'+all.length+' rows in view · page '+(state.rawPage+1)+' of '+pages+'</span></div>'+
  (pg.length?'<div style="overflow:auto"><table class="tbl"><thead><tr><th>Date</th><th>Teammate</th><th>Version</th><th>Package</th></tr></thead><tbody>'+
   pg.map(r=>'<tr><td>'+r.d+'</td><td class="tname">'+r.a+'</td><td class="mono">'+r.v+(r.pre?' <span class="pill gray">PREBUILD</span>':"")+'</td><td class="mono" style="font-size:12px">'+esc(r.pkg||"—")+'</td></tr>').join("")+
  '</tbody></table></div>':emptyState("No rows match."))+
  '<div class="pgbtns" id="rawpg">'+Array.from({length:pages},(_,i)=>'<button data-pg="'+i+'" class="'+(i===state.rawPage?"on":"")+'">'+(i+1)+'</button>').join("")+'</div></div>');
}
function wireRaw(){document.querySelectorAll("#rawpg button").forEach(b=>b.onclick=()=>{state.rawPage=+b.dataset.pg;refresh()})}

 el.innerHTML=
 '<div class="kpirow" style="grid-template-columns:repeat(3,1fr)">'+QUEUES.map((qd,i)=>'<div class="kpi"><div class="lab">'+qd.name+'</div><div class="num" id="qk'+i+'">0</div><span class="sub">cards on the queue</span></div>').join("")+'</div>'+

 '<div class="grid2eq">'+

 '</div>'+
 card("Pipeline","how a change becomes a registry row",'<div class="pstrip"><b>card</b>'+arrow()+'<b>triage</b>'+arrow()+'<b>Ready</b>'+arrow()+'<b>freeze</b>'+arrow()+'<b>merge (human)</b>'+arrow()+'<b>deploy-close</b>'+arrow()+'<b>registry row</b></div>');

 hBars(q("#cFrozen"),FROZEN_BY_LINE.map((f,i)=>({label:f[0],n:f[1],c:ramp[i%ramp.length]})),{lw:190});
}

 '</div>'+
 '<div class="card"><div class="hd"><h3>V2 metrics</h3><span class="cap">not derivable from this snapshot — never faked</span></div><div class="bd"><div class="qgrid" style="margin-top:0">'+
  V2METRICS.map(m=>'<div class="qcard v2"><div class="lab">'+m+'</div><div class="num">—</div><span class="v2chip">V2 — NEEDS INSTRUMENTATION</span></div>').join("")+
 '</div></div></div>';

/* ============ ROUTER + REFRESH ============ */
const TITLES={overview:"Overview",deployments:"Deployments",pipeline:"Release Pipeline",quality:"Quality & Governance",blocked:"Blocked & Decisions",activity:"Activity"};
function curPage(){const h=location.hash.replace("#","");return TITLES[h]?h:"overview"}
function refresh(){
 renderFbar();
 const p=curPage();
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
 document.querySelectorAll(".page").forEach(pg=>pg.classList.toggle("on",pg.id==="pg-"+p));
 document.getElementById("ptitle").textContent=TITLES[p];
 ({overview:pgOverview,deployments:pgDeployments,pipeline:pgPipeline,quality:pgQuality,blocked:pgBlocked,activity:pgActivity})[p]();
}
window.addEventListener("hashchange",refresh);
window.addEventListener("resize",()=>refresh());
document.getElementById("gsearch").addEventListener("input",e=>{state.q=e.target.value;refresh();document.getElementById("gsearch").focus()});
refresh();
</script>
