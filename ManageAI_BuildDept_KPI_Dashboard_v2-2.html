<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage AI — Build Department KPI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--navy2:#1B2740;--blue:#4A90E2;--blueDk:#0070C0;--body:#5A6C7D;--bord:#E2E8F0;--grid:#E6EBF1;--surf:#F8FAFC;--surf2:#F1F5F9;--good:#10B981;--bad:#EF4444;--mut:#9CA3AF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,Arial,sans-serif;color:var(--body);background:#fff;font-size:14px}
h1,h2,h3,.mont{font-family:Montserrat,Arial,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blueDk)}
button{font-family:inherit;cursor:pointer}
#root{display:flex;min-height:100vh}
/* sidebar */
#side{width:230px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#side .logo{padding:22px 20px 18px;font-family:Montserrat;font-weight:800;font-size:19px;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.08)}
#side .logo b{color:#fff}#side .logo span{color:var(--blue)}
#side .sub{font-family:Montserrat;font-weight:600;font-size:12px;letter-spacing:.12em;color:#7D8CA3;margin-top:5px}
nav{padding:14px 0;flex:1}
nav a{display:flex;align-items:center;gap:11px;padding:11px 20px;color:#AEBCCB;font-weight:500;font-size:13.5px;border-left:3px solid transparent}
nav a svg{flex:none}
nav a:hover{background:rgba(255,255,255,.05);color:#fff}
nav a.on{background:var(--navy2);color:#fff;border-left-color:var(--blue)}nav a{transition:all .18s ease}
#side .foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.snapchip{display:inline-block;background:var(--navy2);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 10px;border-radius:6px}
.livesync{display:flex;align-items:center;gap:8px;margin-top:12px;color:#7D8CA3;cursor:not-allowed}
.livesync .tog{width:30px;height:16px;border-radius:8px;background:#2A3A55;position:relative}
.livesync .tog::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#55688A}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:16px;padding:0 28px;height:60px}
#top h1{font-size:19px;font-weight:700;color:var(--navy);margin:0;flex:1;letter-spacing:-.01em}
#gsearch{width:250px;padding:8px 14px;border:1px solid var(--bord);border-radius:99px;font:inherit;font-size:13px;color:var(--navy);background:var(--surf)}
#gsearch:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{background:var(--blueDk);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-weight:600;font-size:13px;transition:background .2s ease}
.btn:hover{background:#005A9C}
/* filter bar */
#fbar{position:sticky;top:60px;z-index:29;background:#fff;border-bottom:1px solid var(--bord);padding:10px 28px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.flabel{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--bord);border-radius:99px;overflow:hidden;background:#fff}
.seg button{background:transparent;border:none;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--body);border-radius:99px;transition:all .2s ease}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
.chip{border:1px solid var(--bord);background:#fff;border-radius:14px;padding:4px 11px;font-size:12px;font-weight:500;color:var(--body)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{opacity:.7;font-size:11px}
.reset{background:none;border:none;color:var(--blue);font-weight:600;font-size:12.5px}
.fcap{font-size:12px;color:var(--mut);width:100%}
/* content */
#content{padding:30px 32px 12px;flex:1;background:var(--surf)}
.page{display:none;max-width:1460px;margin:0 auto}
.page.on{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kpirow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:var(--navy);border-radius:18px;padding:22px 24px;color:#fff;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}.kpi::after{content:"";position:absolute;left:24px;right:auto;bottom:0;top:0;width:0}.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.18)}
.kpi .lab{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.1em;color:#fff;opacity:.75;text-transform:uppercase}
.kpi .num{font-family:Montserrat;font-weight:800;font-size:40px;color:#fff;margin:8px 0 3px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:#fff;opacity:.85}
.kpi .sub .up{color:var(--good)}.kpi .sub .dn{color:var(--bad)}
.card{background:#fff;border:1px solid var(--bord);border-radius:18px;box-shadow:0 1px 3px rgba(15,23,42,.05);margin-top:18px;transition:box-shadow .25s ease}.card:hover{box-shadow:0 8px 24px rgba(15,23,42,.07)}
.card .hd{padding:14px 20px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:12px}
.card .hd h3{margin:0;font-size:14px;font-weight:700;color:var(--navy);flex:1}
.card .hd .cap{font-size:12px;color:var(--mut)}
.card .bd{padding:22px 24px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.grid2eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.insight{margin-top:14px;font-size:14px;color:var(--navy);background:#fff;border:1px solid var(--bord);border-left:3px solid var(--blue);border-radius:10px;padding:12px 16px}
canvas.chart{width:100%;display:block}
/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;text-align:left;padding:10px 12px;border-bottom:1px solid var(--bord);cursor:pointer;white-space:nowrap;user-select:none;background:var(--surf)}
.tbl th .si{color:var(--blue)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--surf2);color:var(--body);white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover{background:var(--surf)}
.tbl tr.sel{background:#EDF5FD}
.tname{font-weight:600;color:var(--navy)}
.d-up{color:var(--good);font-weight:600}.d-dn{color:var(--bad);font-weight:600}.d-z{color:var(--mut)}
.pill{display:inline-block;font-family:Montserrat;font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.pill.gray{background:var(--surf2);color:var(--mut)}
.pill.blue{background:#E0F2FE;color:var(--blueDk)}
.pill.green{background:#D1FAE5;color:#047857}
.pill.navy{background:var(--navy);color:#fff}
.v2chip{display:inline-block;background:#E0F2FE;color:var(--blueDk);font-family:Montserrat;font-weight:700;font-size:12px;padding:3px 10px;border-radius:6px;letter-spacing:.05em}
/* ticker / feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:10px 0;border-bottom:1px solid var(--surf2);display:flex;gap:10px;align-items:baseline}
.feed .prn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blueDk);flex:none}
.feed .prt{font-size:13px;color:var(--body);line-height:1.4}
/* timeline */
.tline{position:relative;margin:8px 0 4px;padding-left:0;height:96px}
.tline .axis{position:absolute;left:0;right:0;top:46px;height:2px;background:var(--grid)}
.tline .dot{position:absolute;top:40px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.tline .vl{position:absolute;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--navy);transform:translateX(-50%);white-space:nowrap}
.tline .dl{position:absolute;top:66px;font-size:12px;color:var(--mut);transform:translateX(-50%);white-space:nowrap}
/* blocked cards */
.ownergrp{margin-top:14px}
.bcard{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px 18px;margin-top:10px;display:flex;gap:14px;align-items:flex-start}
.bcard .it{font-weight:600;color:var(--navy);min-width:210px}
.bcard .nt{flex:1;font-size:13px;line-height:1.45}
.ochip{display:inline-block;background:var(--navy);color:#fff;font-family:Montserrat;font-weight:700;font-size:12px;padding:3px 11px;border-radius:12px}
/* activity timeline */
.vtl{position:relative;margin:6px 0 0;padding-left:26px}
.vtl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--grid)}
.vtl .ev{position:relative;padding:9px 0}
.vtl .ev::before{content:"";position:absolute;left:-23px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
/* pipeline strip */
.pstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--mut)}
.pstrip b{color:var(--body);font-weight:600;background:var(--surf2);border-radius:6px;padding:4px 10px}
.pstrip svg{flex:none}
/* quality */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.qcard{background:#fff;border:1px solid var(--bord);border-radius:18px;padding:22px 24px;box-shadow:0 1px 3px rgba(15,23,42,.05);transition:box-shadow .25s ease}.qcard:hover{box-shadow:0 8px 24px rgba(15,23,42,.07)}
.qcard .lab{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.qcard .num{font-family:Montserrat;font-weight:800;font-size:30px;color:var(--navy);margin:8px 0 4px}
.qcard .num em{font-style:normal;color:var(--blue)}
.qcard .sub{font-size:12.5px;line-height:1.45}
.qcard.v2 .num{color:var(--mut);font-weight:700}
/* empty */
.empty{padding:36px 20px;text-align:center;color:var(--mut)}
.empty svg{display:block;margin:0 auto 10px}
/* tooltip */
#tip{position:fixed;z-index:99;background:var(--navy);color:#fff;font-size:12px;padding:6px 10px;border-radius:7px;pointer-events:none;display:none;white-space:pre;font-family:Inter}
/* footer */
#foot{padding:16px 28px 22px;background:var(--surf);text-align:center;font-size:12px;color:var(--mut)}
.errbanner{background:var(--bad);color:#fff;font-weight:600;padding:12px 20px;border-radius:10px;margin-bottom:14px}
/* projections */
.batoggle{display:flex;justify-content:center;margin:6px 0 20px}
.batoggle .trk{display:inline-flex;background:var(--navy);border-radius:14px;padding:6px;gap:6px}
.batoggle button{font-family:Montserrat;font-weight:800;font-size:14px;letter-spacing:.08em;border:none;border-radius:9px;padding:13px 30px;background:transparent;color:#7D8CA3;transition:all .2s ease}
.batoggle button.on{background:var(--blue);color:#fff}
.bastate{animation:fadeUp .35s ease}
.story{background:#fff;border:1px solid var(--bord);border-left:3px solid var(--blue);border-radius:12px;padding:18px 22px;font-size:14.5px;line-height:1.6;color:var(--navy);max-width:1000px}
.story h2{margin:0 0 8px;font-size:17px;color:var(--navy)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.chipA{display:inline-block;font-family:Montserrat;font-weight:800;font-size:12px;letter-spacing:.06em;border-radius:6px;padding:2px 8px;background:var(--blue);color:#fff}
.chipS{display:inline-block;font-family:Montserrat;font-weight:800;font-size:12px;letter-spacing:.06em;border-radius:6px;padding:2px 8px;background:#fff;color:var(--blueDk);border:1.5px dashed var(--blue)}
.ladder{display:flex;gap:0;align-items:center;flex-wrap:wrap}
.ladder .rung{background:var(--surf2);border:1px solid var(--bord);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:600;color:var(--navy)}
.ladder .rung small{display:block;font-weight:400;color:var(--body);margin-top:3px}
@media(max-width:800px){.statgrid{grid-template-columns:1fr}}
.pgbtns{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 0 0}
.pgbtns button{border:1px solid var(--bord);background:#fff;border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--body)}
.pgbtns button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.searchmini{padding:8px 12px;border:1px solid var(--bord);border-radius:8px;font:inherit;font-size:13px;width:220px}
@media(max-width:1100px){#side{width:64px}#side .logo{font-size:0;padding:20px 12px}#side .logo span{font-size:17px}#side .sub,#side nav a em,#side .foot{display:none}nav a{justify-content:center;padding:12px}}
@media(max-width:800px){.kpirow{grid-template-columns:1fr 1fr}.grid2,.grid2eq,.qgrid{grid-template-columns:1fr}#fbar{top:auto;position:static}}
@media print{#side,#fbar,#top #gsearch,#top .btn{display:none}#content{padding:0}}
</style>
</head>

const fmtD=(j,a)=>{const d=a-j,p=j? (d/j*100).toFixed(1):null;return{d,txt:(d>0?"+":"")+d+(p!==null?" ("+(d>0?"+":"")+p+"%)":j===0&&a>0?" (new line)":"")}};
function countUp(el,to){const from=+ (el.dataset.v||0);el.dataset.v=to;const t0=performance.now();
 (function f(t){const k=Math.min(1,(t-t0)/220);el.textContent=Math.round(from+(to-from)*k).toLocaleString();if(k<1)requestAnimationFrame(f)})(t0);}
function emptyState(msg){return '<div class="empty"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+msg+'</div>'}

function renderFbar(){
 const fb=document.getElementById("fbar");
 const mopts=[["all","All"],["07","July 2026"],["08","August 2026"]];
 const ropts=[["prod","Production"],["all","All"],["pre","Prebuild only"]];
 const active=[];
 if(state.month!=="all")active.push({t:mopts.find(m=>m[0]===state.month)[1],x:()=>state.month="all"});
 if(state.team.size<ASSETS.length)[...state.team].forEach(a=>active.push({t:a,x:()=>{state.team=new Set(ASSETS)}}));
 if(state.rel!=="prod")active.push({t:ropts.find(r=>r[0]===state.rel)[1],x:()=>state.rel="prod"});
 if(state.sel)active.push({t:"drill: "+state.sel,x:()=>state.sel=null});
 fb.innerHTML=
  '<span class="flabel">MONTH</span><span class="seg">'+mopts.map(m=>'<button data-m="'+m[0]+'" class="'+(state.month===m[0]?"on":"")+'">'+m[1]+'</button>').join("")+'</span>'+
  '<span class="flabel">RELEASE TYPE</span><span class="seg">'+ropts.map(r=>'<button data-r="'+r[0]+'" class="'+(state.rel===r[0]?"on":"")+'">'+r[1]+'</button>').join("")+'</span>'+
  '<span class="flabel">TEAMMATES</span><span class="chips">'+ASSETS.map(a=>{const c=ROWS.filter(r=>r.a===a).length;return '<button class="chip '+(state.team.has(a)&&state.team.size<ASSETS.length?"on":state.team.size===ASSETS.length?"":"")+' '+(state.team.size<ASSETS.length&&state.team.has(a)?"on":"")+'" data-a="'+a+'">'+a+' <small>'+c+'</small></button>'}).join("")+'</span>'+
  '<button class="reset" id="resetf">Reset</button>'+
  (active.length?'<span class="chips" style="width:100%">'+active.map((c,i)=>'<button class="chip on" data-x="'+i+'">'+esc(c.t)+' ✕</button>').join("")+'</span>':"")+
  '<span class="fcap">Production view excludes July prebuild releases ('+ROWS.filter(r=>r.pre).length+' rows, all July) — switch to “All” to reconcile to 223.</span>';
 fb.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.month=b.dataset.m;refresh()});
 fb.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{state.rel=b.dataset.r;refresh()});
 fb.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(state.team.size===ASSETS.length){state.team=new Set([a])}
  else if(state.team.has(a)){state.team.delete(a);if(!state.team.size)state.team=new Set(ASSETS)}
  else state.team.add(a);refresh()});
 fb.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{active[+b.dataset.x].x();refresh()});
 document.getElementById("resetf").onclick=()=>{state.month="all";state.team=new Set(ASSETS);state.rel="prod";state.sel=null;refresh()};
}

function drill(g){

 return card("Drill-down — "+name+" version timeline",rs.length+" releases · "+rs[0].v+" → "+rs[rs.length-1].v,
  '<div class="tline"><div class="axis"></div>'+show.map((r,i)=>{const p=6+88*(Date.parse(r.d)-first)/span;
   return '<span class="dot" style="left:'+p+'%" title="'+r.v+' · '+r.d+'"></span><span class="vl" style="left:'+p+'%;top:'+(i%2?"8px":"22px")+'">'+r.v+'</span><span class="dl" style="left:'+p+'%">'+r.d.slice(5)+'</span>'}).join("")+'</div>'+

   tbl.slice().sort((x,y)=>y.d.localeCompare(x.d)).map(r=>'<tr><td>'+r.d+'</td><td class="mono">'+r.v+(r.pre?' <span class="pill gray">PREBUILD</span>':"")+'</td><td class="mono" style="font-size:12px">'+esc(r.pkg||"—")+'</td></tr>').join("")+

let baMode="after";let projTab="numbers";
const SCEN=[{k:"Conservative",n:140,a:"Autosweep sweeps + reports only (BUILD-HOLD stays); current run-rate holds — automation removes relay drag only."},{k:"Base",n:170,a:"Holds lifted; trial graduates to staged builds at human merge pace — merge bandwidth is the binding constraint."},{k:"Upside",n:210,a:"Freeze backlog clears (29 freeze-ready + 39 one-ruling-away); records-PRs earn scoped auto-merge."}];
function projChart(cv,grayFuture){const{ctx,W,H}=prep(cv,320);const pad={l:44,r:12,t:26,b:40};const max=niceMax(210);axes(ctx,W,H,pad,max);
 const months=["Jul","Aug","Sep","Oct","Nov"];const gw=(W-pad.l-pad.r)/5;const ih=H-pad.t-pad.b;
 const bar=(x,w,v,solid,gray,tipTxt)=>{const bh=ih*v/max,y=H-pad.b-bh;
  if(solid){ctx.fillStyle=gray?"#CBD5E1":"#4A90E2";ctx.beginPath();ctx.roundRect(x,y,w,bh,[4,4,0,0]);ctx.fill();}
  else{ctx.save();ctx.strokeStyle=gray?"#CBD5E1":"#4A90E2";ctx.lineWidth=1.6;ctx.setLineDash([5,4]);ctx.beginPath();ctx.roundRect(x,y,w,bh,[4,4,0,0]);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.rect(x,y,w,bh);ctx.clip();for(let hx=x-bh;hx<x+w;hx+=7){ctx.beginPath();ctx.moveTo(hx,H-pad.b);ctx.lineTo(hx+bh,y);ctx.globalAlpha=.5;ctx.stroke();ctx.globalAlpha=1}ctx.restore();}
  ctx.fillStyle=gray?"#9CA3AF":"#0F172A";ctx.font="700 12px Montserrat,Arial";ctx.textAlign="center";ctx.fillText(v,x+w/2,y-6);
  cv._hits.push({x,y,w,h:bh,tip:tipTxt});};
 const actual=[89,134];
 actual.forEach((v,i)=>{const gx=pad.l+gw*i+(gw-56)/2;bar(gx,56,v,true,false,months[i]+" 2026 — ACTUAL: "+v+" deploys");
  ctx.fillStyle="#5A6C7D";ctx.font="12px Inter,Arial";ctx.fillText(months[i],pad.l+gw*i+gw/2,H-pad.b+18);});
 [2,3,4].forEach(mi=>{const bw=22;const gx=pad.l+gw*mi+(gw-bw*3-8)/2;
  SCEN.forEach((s,si)=>bar(gx+si*(bw+4),bw,s.n,false,grayFuture,months[mi]+" — SCENARIO ("+s.k+"): ~"+s.n+"/mo\n"+s.a));
  ctx.fillStyle="#5A6C7D";ctx.font="12px Inter,Arial";ctx.textAlign="center";ctx.fillText(months[mi],pad.l+gw*mi+gw/2,H-pad.b+18);});}
function statCard(lab,val,sub){return '<div class="qcard"><div class="lab">'+lab+'</div><div class="num"><em>'+val+'</em></div><div class="sub">'+sub+'</div></div>'}
function pgProjections(){
 const el=document.getElementById("pg-projections");
 const after=baMode==="after";
 const story=projTab==="story";
 el.innerHTML=
 '<div style="text-align:center;font-size:12.5px;color:var(--mut);margin-bottom:8px">Snapshot narrative — filters don\u2019t apply.</div>'+
 '<div class="batoggle" style="margin-bottom:10px"><span class="trk"><button id="ptN" class="'+(story?"":"on")+'">NUMBERS</button><button id="ptS" class="'+(story?"on":"")+'">THE STORY</button></span></div>'+
 (story?'<div class="bastate">'+storyView()+'</div>':
  '<div class="batoggle"><span class="trk"><button id="baB" class="'+(after?"":"on")+'">BEFORE CLAUDE CODE</button><button id="baA" class="'+(after?"on":"")+'">AFTER CLAUDE CODE</button></span></div>'+
  '<div class="bastate">'+(after?afterState():beforeState())+'</div>');
 q("#ptN").onclick=()=>{projTab="numbers";refresh()};
 q("#ptS").onclick=()=>{projTab="story";refresh()};
 if(!story){
  q("#baB").onclick=()=>{baMode="before";refresh()};
  q("#baA").onclick=()=>{baMode="after";refresh()};
  projChart(q("#cProj"),!after);
 }
}
const MILESTONES=[["Jul 12","First prebuild deploys logged — the registry starts"],["Aug 1","forge 1.18.0: the factory\u2019s own records go first-class"],["Aug 18","The 18e wave: 5 asset versions in one coordinated release"],["Aug 25","Forge stands up on Claude Code, supervised"],["Aug 26","A dedicated server: the factory gets its own machine"],["Aug 27","The semi-automated sweep is armed. The modem is retired."]];
function storyView(){
 const P=t=>'<p style="margin:0 0 18px">'+t+'</p>';
 const pull=t=>'<div style="border-left:4px solid var(--blue);padding:6px 0 6px 22px;margin:30px 0;font-family:Montserrat;font-weight:600;font-size:20px;line-height:1.5;color:var(--navy)">'+t+'</div>';
 const chap=(n,t)=>'<div style="background:var(--navy);border-radius:14px;padding:20px 28px;margin:38px 0 24px"><span style="font-family:Montserrat;font-weight:800;font-size:12px;letter-spacing:.18em;color:var(--blue)">CHAPTER '+n+'</span><div style="font-family:Montserrat;font-weight:800;font-size:24px;color:#fff;margin-top:4px">'+t+'</div></div>';
 return '<div style="background:#fff;border:1px solid var(--bord);border-radius:18px;max-width:860px;margin:0 auto;padding:54px 64px;font-size:16px;line-height:1.7;color:var(--body)">'+
 '<span class="pill blue" style="font-size:12px">3 MIN READ</span>'+
 '<div style="font-family:Montserrat;font-weight:800;font-size:13px;letter-spacing:.16em;color:var(--blue);margin:22px 0 10px">HOW THE FACTORY LEARNED TO RUN ITSELF</div>'+
 '<h2 style="font-family:Montserrat;font-weight:800;font-size:34px;line-height:1.15;letter-spacing:-.02em;color:var(--navy);margin:0 0 8px">The old way, the new way, and what actually changed</h2>'+
 chap(1,"The relay era")+
 P("A build used to begin with a person writing a prompt in one window and pasting it into another. That\u2019s not a metaphor — that was the transport layer. Brian would ssh into the server, hand Forge its instructions, and watch a terminal for twenty-five minutes. When the run finished, the results left the machine the only way they could: as a screenshot. The screenshot went to a second AI for adversarial review, the verdict came back to Brian, Brian merged what passed, and then he typed the next step by hand.")+
 P("Five relay steps per cycle. Every one of them through the same person.")+
 pull("\u201cJuly shipped 89 deploys — and every single one passed through one person\u2019s hands twice.\u201d")+
 P("The factory itself was never the problem. The discipline was already real: append-only registries, eval gates, freeze protocols, human sign-off on every merge. What was missing was a transport worthy of it. When Brian was at the keyboard, the factory ran. When he slept, it slept. A ruling posted at 9pm waited for the morning relay. The night of August 26th made the case better than any memo: clearing one governance chain — the work that unblocked 29 releases — took until sunrise. Good work, moved entirely by hand.")+
 '<div style="margin:36px 0;padding-left:8px">'+MILESTONES.map(m=>'<div style="display:flex;gap:18px;padding:0 0 22px;position:relative"><span style="flex:none;width:2px;background:var(--grid);position:absolute;left:5px;top:14px;bottom:0"></span><span style="flex:none;width:12px;height:12px;border-radius:50%;background:var(--blue);margin-top:5px;position:relative;z-index:1;border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)"></span><span style="flex:none;font-family:Montserrat;font-weight:800;font-size:13px;color:var(--navy);width:62px;margin-top:3px">'+m[0]+'</span><span style="font-size:14.5px;margin-top:2px">'+m[1]+'</span></div>').join("")+'</div>'+
 chap(2,"The machine loop")+
 P("Now a timer wakes Forge every two hours on a server that belongs to it. First it checks — for free, no AI spend — whether anything changed: two repos, three boards. Most ticks, nothing has, and the tick ends having cost nothing. When something has changed, Forge runs the full discipline: git first, because git is the only truth about what shipped; then the boards; then reconcile, re-test every blocked item, classify everything approved, stage the work, and report.")+
 P("The first unattended tick is worth telling precisely. It swept all 70 Ready cards, posted seven comments, staged nothing it wasn\u2019t allowed to, wrote its digest, and stopped — twenty-five minutes, $5.27. One of those seven comments was a refusal: asked by drift to move a card to a lane the state machine forbids, it declined and cited the law. And when its digest branch came out malformed, it found the defect itself, reported it before anyone asked, and the fix didn\u2019t patch the bug — it removed the entire class of bug, every silenced error in the runner, gone.")+
 pull("\u201cThe machine does the typing. Humans keep every decision — which is the only thing that ever deserved to be one.\u201d")+
 P("Nothing merges without a person. Nothing gets created that a person didn\u2019t originate. Spend is metered, alerted at 70 and 90 percent, and held at the line. The two gates that remain — the merge and the morning review — aren\u2019t what\u2019s left over after automation. They\u2019re the point of it. Everything else existed to protect them.")+
 '<div style="background:var(--navy);border-radius:16px;padding:36px 40px;margin-top:40px"><div style="font-family:Montserrat;font-weight:800;font-size:24px;line-height:1.4;color:#fff">\u201cAI doesn\u2019t fail from bad technology. It fails from bad management.\u201d</div><p style="color:#fff;opacity:.85;font-size:15px;line-height:1.65;margin:16px 0 0">We run our own AI workforce the way we tell customers to run theirs: written law, budgets, review, and autonomy that is earned tick by tick — never assumed. The numbers one tab over are what that management looks like when it compounds. <span style="color:var(--blue);font-weight:600">— The Build Department, August 2026</span></p></div>'+
 '</div>';
}
const projCaption='<div style="font-size:12.5px;color:var(--mut);margin-top:10px">Sep–Nov are scenarios, not records. Assumptions stated; actuals are solid, scenarios are outlined. Nothing here is a commitment.</div>';
const projLegend='<div style="display:flex;gap:14px;margin:4px 0 8px;font-size:12px;color:var(--mut);align-items:center"><span class="chipA">ACTUAL</span><span>solid</span><span class="chipS">SCENARIO</span><span>outlined · Conservative ~140 · Base ~170 · Upside ~210</span></div>';
function beforeState(){
 return '<div class="story"><h2>The factory ran through one person</h2>July\u2019s factory was good work moving through a human modem. Every sweep, build, and board reconcile was hand-relayed: write the prompt, paste it to the server, watch the terminal, screenshot the result, relay it back for review, type the next step. The loop only moved while Brian was at the keyboard — overnight and weekends the factory stood still, and reaction to a ruling waited for the next relay.</div>'+
 '<div class="statgrid">'+
 statCard("Coverage","Desk hours","Loop moved only while Brian was at the keyboard.")+
 statCard("Reaction to a ruling","Hours–days","Next manual relay.")+
 statCard("Builds per day","1–3","Hand-driven, serial.")+
 statCard("Relay steps per cycle","5","Write → paste → watch → screenshot → relay.")+
 statCard("Overnight + weekend throughput","0","The factory stood still.")+
 statCard("Cost visibility","None","No meter existed.")+
 '</div>'+
 card("July actual — and what came after","future months grayed in this view",projLegend+'<canvas class="chart" id="cProj"></canvas>'+projCaption);
}
function afterState(){
 return '<div class="story"><h2>The machine does the typing; humans keep every decision</h2>In August the factory moved onto its own server — Forge on Claude Code, working the queues every two hours: reading git and the boards, re-testing every blocked item, staging pull requests, metering its own spend, and reporting in. Nothing merges without a human; nothing gets created that a human didn\u2019t approve. August shipped 134 deploys — up 50.6% on July — and that gain happened with Claude Code still <em>supervised</em>. The autosweep, armed on Aug 27, is that same discipline running 24/7.</div>'+
 '<div class="statgrid">'+
 statCard("Coverage","24/7","12 ticks/day; idle ticks cost $0.")+
 statCard("Detection of any change","≤2h","Rulings absorbed the next tick.")+
 statCard("Staged-build ceiling","~24/day","2 independent lines × 12 ticks.")+
 statCard("Measured tick","$5.27","Full 70-card sweep, 55 turns, ~25 min, unattended.")+
 statCard("Human role","2 gates","Merge queue + morning review — the modem is retired.")+
 statCard("Every merge","Human","Structural, not promised.")+
 '</div>'+
 card("Actuals and scenarios — Jul–Nov 2026","hover any bar for the assumption",projLegend+'<canvas class="chart" id="cProj"></canvas>'+projCaption)+
 '<div class="grid2eq">'+
 card("The cost math","law, not aspiration",'<table class="tbl"><tbody><tr><td>Idle tick</td><td style="text-align:right;font-weight:600;color:var(--navy)">$0</td></tr><tr><td>Measured active tick</td><td style="text-align:right;font-weight:600;color:var(--navy)">$5.27</td></tr><tr><td>Hard cap per tick</td><td style="text-align:right;font-weight:600;color:var(--navy)">$25</td></tr><tr><td>Illustrative month — 4 active ticks/day (4 × $5.27 × 30)</td><td style="text-align:right;font-weight:600;color:var(--navy)">≈ $632</td></tr><tr><td>Per staged build</td><td style="text-align:right;font-weight:600;color:var(--navy)">≈ $2–5</td></tr></tbody></table><div style="font-size:12.5px;color:var(--mut);margin-top:8px">The meter, the 70/90% alerts, and the hard hold are already law (R8, PR #322).</div>')+
 card("What changes for who","",'<div style="display:flex;flex-direction:column;gap:12px"><div><strong style="color:var(--navy)">Brian</strong> — modem → gate: merge queue + a 30-minute morning review.</div><div><strong style="color:var(--navy)">Chad &amp; Dave</strong> — a ruling posted on a card is absorbed within 2 hours; decision latency becomes the factory\u2019s visible bottleneck metric, by design.</div><div><strong style="color:var(--navy)">The factory</strong> — the only rate limit left is the human decision it exists to protect.</div></div>')+
 '</div>'+
 card("The graduation ladder","earned, not scheduled",'<div class="ladder"><span class="rung">Staged trial<small>48h · everything staged</small></span>'+arrow()+'<span class="rung">Scoped merge rights<small>records PRs first</small></span>'+arrow()+'<span class="rung">Wider autonomy<small>earned per class</small></span></div><div style="font-size:12.5px;color:var(--mut);margin-top:10px">Each rung is earned by the trust ledger: digest claims verified against HEAD daily, zero write-floor violations.</div>')+
 card("Proof it already works","dry tick, 2026-08-27 08:29Z",'<div style="font-size:13.5px;line-height:1.55;color:var(--navy)">Clean six-step sweep of 70 Ready cards · 7 correct card comments — including one refusal to move a lane the state machine forbids · one real defect found, self-reported, and fixed with its whole class eliminated · <strong>$5.27</strong>.</div>');
}

/* ============ ROUTER + REFRESH ============ */
const TITLES={overview:"Overview",deployments:"Deployments",pipeline:"Release Pipeline",quality:"Quality & Governance",blocked:"Blocked & Decisions",activity:"Activity",projections:"Projections"};
function curPage(){const h=location.hash.replace("#","");return TITLES[h]?h:"overview"}
function refresh(){
 renderFbar();
 const p=curPage();
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
 document.querySelectorAll(".page").forEach(pg=>pg.classList.toggle("on",pg.id==="pg-"+p));
 document.getElementById("ptitle").textContent=TITLES[p];
 document.getElementById("fbar").style.display=(p==="projections")?"none":"";
 ({overview:pgOverview,deployments:pgDeployments,pipeline:pgPipeline,quality:pgQuality,blocked:pgBlocked,activity:pgActivity,projections:pgProjections})[p]();
}
window.addEventListener("hashchange",refresh);
window.addEventListener("resize",()=>refresh());
document.getElementById("gsearch").addEventListener("input",e=>{state.q=e.target.value;refresh();document.getElementById("gsearch").focus()});
refresh();
</script>
